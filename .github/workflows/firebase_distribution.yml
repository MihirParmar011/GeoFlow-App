name: Build & Distribute to Firebase App Distribution

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-distribute:
    name: Build Release APK and Distribute
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required for Gradle and Flutter build)
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Flutter environment
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Restore Firebase configuration files from Secrets if not in git
      - name: ⚙️ Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              mkdir -p android/app
              echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              echo "✅ Created android/app/google-services.json from secret"
            else
              echo "❌ Error: android/app/google-services.json is missing and GOOGLE_SERVICES_JSON secret is not set."
              echo "Please add GOOGLE_SERVICES_JSON to GitHub Repository Secrets or commit google-services.json to git."
              exit 1
            fi
          else
            echo "✅ android/app/google-services.json found in repository."
          fi

          if [ ! -f "lib/firebase_options.dart" ]; then
            if [ -n "$FIREBASE_OPTIONS_DART" ]; then
              mkdir -p lib
              echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
              echo "✅ Created lib/firebase_options.dart from secret"
            fi
          fi

      # Step 5: Install Flutter dependencies
      - name: 📦 Install Dependencies
        run: flutter pub get

      # Step 6: Verify static analysis
      - name: 🔍 Static Analysis
        run: flutter analyze

      # Step 7: Build the Release APK
      - name: 🔨 Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # Step 8: Upload APK as GitHub Action Artifact (for download directly from GitHub)
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Step 9: Distribute APK to Firebase App Distribution using official Firebase CLI
      - name: 🚀 Distribute to Firebase App Distribution
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:1011942886407:android:a9d46be3a6f3c7e2662ea2' }}
          GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS || 'qa, tester' }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning title=Firebase App Distribution Skipped::Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_SERVICE_ACCOUNT_KEY secret is set in GitHub Secrets. The APK build succeeded and is available in Artifacts."
            exit 0
          fi

          echo "Installing Firebase CLI tools..."
          npm install -g firebase-tools

          echo "Writing service account credentials..."
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          echo "Distributing APK to Firebase App Distribution (App ID: $APP_ID, Groups: $GROUPS)..."
          if [ -n "$GROUPS" ]; then
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$APP_ID" \
              --groups "$GROUPS" \
              --release-notes "Build commit ${{ github.sha }} on ${{ github.ref_name }}: ${{ github.event.head_commit.message }}" || \
            (echo "::warning::Distributing with tester groups failed. Falling back to distributing without groups..." && \
             firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$APP_ID" \
              --release-notes "Build commit ${{ github.sha }} on ${{ github.ref_name }}: ${{ github.event.head_commit.message }}")
          else
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
              --app "$APP_ID" \
              --release-notes "Build commit ${{ github.sha }} on ${{ github.ref_name }}: ${{ github.event.head_commit.message }}"
          fi

