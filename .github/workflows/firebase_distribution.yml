name: Build & Distribute to Firebase App Distribution

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-distribute:
    name: Build Release APK and Distribute
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required for Gradle and Flutter build)
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Flutter environment
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Restore Firebase configuration files from Secrets if not in git
      - name: ⚙️ Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              mkdir -p android/app
              echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              echo "✅ Created android/app/google-services.json from secret"
            else
              echo "❌ Error: android/app/google-services.json is missing and GOOGLE_SERVICES_JSON secret is not set."
              echo "Please add GOOGLE_SERVICES_JSON to GitHub Repository Secrets or commit google-services.json to git."
              exit 1
            fi
          else
            echo "✅ android/app/google-services.json found in repository."
          fi

          if [ ! -f "lib/firebase_options.dart" ]; then
            if [ -n "$FIREBASE_OPTIONS_DART" ]; then
              mkdir -p lib
              echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
              echo "✅ Created lib/firebase_options.dart from secret"
            fi
          fi

      # Step 5: Install Flutter dependencies
      - name: 📦 Install Dependencies
        run: flutter pub get

      # Step 6: Verify static analysis (Optional safety check)
      - name: 🔍 Static Analysis
        run: flutter analyze || true

      # Step 7: Build the Release APK
      - name: 🔨 Build Release APK
        run: flutter build apk --release

      # Step 8: Upload APK as GitHub Action Artifact (for download from GitHub)
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Step 9: Distribute APK to Firebase App Distribution (Runs when FIREBASE_SERVICE_ACCOUNT_KEY is configured)
      - name: 🚀 Upload to Firebase App Distribution
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID || '1:1011942886407:android:a9d46be3a6f3c7e2662ea2' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'testers' }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Branch: ${{ github.ref_name }}

      # Step 10: Notice if Firebase Distribution is skipped
      - name: ℹ️ Firebase Distribution Secret Notice
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY == '' }}
        run: |
          echo "::warning title=Firebase App Distribution Skipped::FIREBASE_SERVICE_ACCOUNT_KEY secret is not set in GitHub repository settings. The APK build succeeded and is available in Artifacts."
